<!doctype html>
<html lang="es-AR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#16573f">

  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="edge-band" aria-hidden="true"></div>
  <header class="appbar" id="appbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 512 512" width="34" height="34"><defs><linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6a4d"/><stop offset="1" stop-color="#0b3022"/></linearGradient><linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9d77c"/><stop offset="1" stop-color="#e3921d"/></linearGradient><linearGradient id="lg-soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e402e"/><stop offset="1" stop-color="#082a1d"/></linearGradient><clipPath id="lg-c"><rect width="512" height="512" rx="112"/></clipPath></defs><g clip-path="url(#lg-c)"><rect width="512" height="512" fill="url(#lg-bg)"/><circle cx="256" cy="290" r="104" fill="url(#lg-sun)"/><rect x="0" y="290" width="512" height="222" fill="url(#lg-soil)"/><g stroke="#f6efdc" stroke-width="16" stroke-linecap="round" opacity=".85"><path d="M256 290 90 512M256 290 173 512M256 290 256 512M256 290 339 512M256 290 422 512"/></g><path d="M0 290H512" stroke="#f6efdc" stroke-width="12" opacity=".55"/></g></svg></span>
      <div class="brand-text"><b id="brand-title">Don Enrique</b><small>Gestión de campo</small></div>
    </div>
    <button class="sync-pill" id="sync" type="button" hidden></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <div id="fab-slot"></div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
